<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Rajdhani has no Cyrillic: borrow it from Tektur (same techno feel) -->
  <alias binding="strong">
    <family>Rajdhani</family>
    <prefer><family>Rajdhani</family><family>Tektur</family></prefer>
  </alias>
</fontconfig>
