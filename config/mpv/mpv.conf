# Night City HUD — mpv
# window
background-color='#081020'
keep-open=yes
save-position-on-quit=yes
hwdec=auto-safe
title='${media-title}  //  NETRUN.MEDIA'
autofit-larger=90%x90%

# on-screen text (Rajdhani; Russian falls back to Tektur via fontconfig)
osd-font='Rajdhani'
osd-font-size=34
osd-bold=yes
osd-color='#c9d1db'
osd-border-color='#081020'
osd-border-size=2.5
osd-shadow-offset=0
osd-bar-align-y=0.92
osd-bar-h=1.6
osd-bar-w=60
osd-duration=1200
osd-playing-msg='▶  ${media-title}'
osd-playing-msg-duration=2500

# subtitles: readable, dark outline
sub-font='Rajdhani'
sub-bold=yes
sub-font-size=44
sub-color='#ffffff'
sub-border-color='#081020'
sub-border-size=3
sub-shadow-offset=1
sub-shadow-color='#00000099'
sub-auto=fuzzy

# screenshots go next to the rest
screenshot-directory='~/Pictures/Screenshots'
screenshot-template='mpv-%F-%P'
