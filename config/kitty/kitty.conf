# Cyberpunk HUD — kitty
font_family      JetBrainsMono Nerd Font Mono
font_size        12.1
disable_ligatures never

shell fish
window_padding_width 12 16
background_opacity 0.92
confirm_os_window_close 0
enable_audio_bell no

cursor_shape block
cursor_blink_interval 0.6
cursor_trail 3
cursor_trail_decay 0.08 0.3
cursor_trail_start_threshold 2

tab_bar_edge top
tab_bar_min_tabs 1
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " TTY.{index:02d} "
active_tab_title_template " TTY.{index:02d}  {fmt.fg._8fa3b8}{title}{fmt.fg.tab} "
active_tab_background #4fa3ae
active_tab_foreground #081020
active_tab_font_style bold
tab_bar_background #081020
hide_window_decorations yes
inactive_tab_background #0e1a30
inactive_tab_foreground #8fa3b8

foreground #c9d1db
background #081020
cursor #4fa3ae
selection_background #1a2a44
selection_foreground #c9d1db
url_color #8fa3b8
color0 #0b1424
color1 #ff4d6a
color2 #3fd47e
color3 #ffa62b
color4 #3d6fa8
color5 #ff3ea5
color6 #4fa3ae
color7 #c9d1db
color8 #3a4a63
color9 #ff7a8f
color10 #6bf0a2
