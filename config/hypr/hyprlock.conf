# Night City corporate lock screen — our palette, original text
$ui    = Rajdhani SemiBold
$uib   = Rajdhani Bold
$mono  = JetBrainsMono NFM ExtraLight
$monor = JetBrainsMono Nerd Font Mono
$fg    = rgb(201, 209, 219)
$muted = rgb(143, 163, 184)
$dim   = rgb(110, 128, 150)
$teal  = rgb(79, 163, 174)
$red   = rgb(230, 0, 0)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = @HOME@/.config/hypr/wall-current
    blur_passes = 2
    blur_size = 5
    brightness = 0.32
    contrast = 1.05
}

# ---- corner header: corporate terminal id ----
image {
    monitor =
    path = @HOME@/.config/hypr/arasaka.png
    size = 40
    rounding = -1
    border_size = 0
    position = 40, -36
    halign = left
    valign = top
}
label {
    monitor =
    text = <b>ARASAKA</b>  //  SECURE WORKSTATION
    color = $fg
    font_size = 15
    font_family = $uib
    position = 92, -38
    halign = left
    valign = top
}
label {
    monitor =
    text = NODE AK-07  ·  NIGHT CITY BRANCH  ·  TOWER LVL 42
    color = $dim
    font_size = 11
    font_family = $ui
    position = 92, -62
    halign = left
    valign = top
}
label {
    monitor =
    text = CLEARANCE  <span foreground="##4fa3ae">LEVEL 3</span>
    color = $muted
    font_size = 12
    font_family = $uib
    position = -40, -40
    halign = right
    valign = top
}
label {
    monitor =
    text = LINK ENCRYPTED  //  CHANNEL SEALED
    color = $dim
    font_size = 11
    font_family = $ui
    position = -40, -62
    halign = right
    valign = top
}

# ---- corporate clock ----
label {
    monitor =
    text = LOCAL TIME  //  NIGHT CITY
    color = $muted
    font_size = 13
    font_family = $uib
    position = 0, 300
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 104
    font_family = $mono
    position = -18, 210
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%S"
    color = $teal
    font_size = 26
    font_family = $mono
    position = 222, 178
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = -5
    size = 420, 1
    color = $dim
    rounding = 0
    border_size = 0
    position = 0, 132
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%a %d.%m.%Y" | tr '[:lower:]' '[:upper:]' | sed 's/$/   \/\/   SESSION SUSPENDED/'
    color = $muted
    font_size = 13
    font_family = $uib
    position = 0, 108
    halign = center
    valign = center
}
label {
    monitor =
    text = OPERATOR  //  GHOST
    color = $dim
    font_size = 12
    font_family = $uib
    position = 0, 80
    halign = center
    valign = center
}

# ---- auth panel ----
shape {
    monitor =
    zindex = -5
    size = 560, 178
    color = rgba(8, 16, 32, 0.78)
    rounding = 0
    border_size = 1
    border_color = rgb(22, 35, 58)
    position = 0, -60
    halign = center
    valign = center
}
shape {
    monitor =
    zindex = -5
    size = 3, 178
    color = $teal
    rounding = 0
    border_size = 0
    position = -279, -60
    halign = center
    valign = center
}
label {
    monitor =
    text = AUTH  //  PASSPHRASE  <span foreground="##4fa3ae">認証</span>
    color = $fg
    font_size = 13
    font_family = $uib
    position = -150, 4
    halign = center
    valign = center
}
label {
    monitor =
    text = FAILED $ATTEMPTS
    color = $dim
    font_size = 12
    font_family = $uib
    position = 215, 4
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 500, 46
    outline_thickness = 1
    inner_color = rgba(11, 20, 36, 0.9)
    outer_color = rgb(22, 35, 58)
    check_color = $teal
    fail_color = $red
    capslock_color = rgb(255, 166, 43)
    font_color = $fg
    font_family = $monor
    fade_on_empty = false
    rounding = 0
    dots_size = 0.28
    dots_spacing = 0.45
    dots_rounding = 0
    dots_center = true
    placeholder_text = <span foreground="##6e8096">_</span>
    fail_text = <span foreground="##e60000"><b>ACCESS DENIED</b></span>
    position = 0, -58
    halign = center
    valign = center
}
label {
    monitor =
    text = ENTER PASSPHRASE TO RESUME SESSION
    color = $dim
    font_size = 11
    font_family = $uib
    position = 0, -118
    halign = center
    valign = center
}

# ---- footer ----
label {
    monitor =
    text = PROPERTY OF ARASAKA CORPORATION  ·  UNAUTHORIZED ACCESS IS LOGGED AND REPORTED TO CORPORATE SECURITY
    color = $dim
    font_size = 10
    font_family = $ui
    position = 0, 34
    halign = center
    valign = bottom
}
label {
    monitor =
    text = $LAYOUT[EN,RU,UA]
    color = $muted
    font_size = 13
    font_family = $uib
    onclick = hyprctl switchxkblayout all next
    position = -40, 30
    halign = right
    valign = bottom
}
